name: Publish reviewed Pages artifact

# Deliberately manual: neither a commit nor a push deploys this workflow.
# Repository Settings > Pages must use GitHub Actions before pushing this release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify publication boundary and synthetic status fixture
        run: |
          node tests/pages-artifact.test.cjs
          node tests/daily-sync-status.test.cjs
      - name: Build only explicitly allowed public assets
        run: node scripts/build-pages.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the allowlisted artifact
        id: deployment
        uses: actions/deploy-pages@v4
