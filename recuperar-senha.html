<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="no-referrer"><title>Trailer Log · Recuperar senha</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"></head>
<body data-auth-page="recovery"><main class="auth-shell"><section class="auth-card" aria-labelledby="authTitle">
<div class="auth-tools"><label for="language" data-i18n="language">Idioma</label><select id="language"><option value="pt">Português</option><option value="en">English</option></select><button type="button" id="themeAuth" data-i18n="theme">Alternar tema</button></div>
<h1>🚛 Trailer Log</h1><h2 id="authTitle" data-i18n="recovery">Recuperar senha</h2><p data-i18n="intro">Sua conta, seus registros. Os dados locais existentes não serão importados automaticamente.</p>
<form id="authForm" method="post" onsubmit="return false" aria-busy="false"><label for="email" data-i18n="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><button type="submit" id="submitAuth" data-i18n="recovery">Recuperar senha</button></form>
<p id="authStatus" role="status" aria-live="polite"></p><a href="index.html" id="openApp" data-i18n="open" hidden>Abrir aplicativo</a>
<nav class="auth-links" aria-label="Conta / Account"><a href="login.html" data-i18n="login">Entrar</a><a href="cadastro.html" data-i18n="signup">Criar conta</a><a href="recuperar-senha.html" data-i18n="forgot">Esqueci minha senha</a><a href="index.html" data-i18n="back">Voltar ao aplicativo</a></nav>
<button type="button" id="logoutAuth" data-i18n="logout">Sair da conta neste navegador</button>
</section></main><script src="supabase-config.js"></script><script src="auth.js"></script><script src="auth-page.js"></script></body></html>
